<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vote Casting Ticker</title>
  <style>
    html, body { margin: 0; padding: 0; }

    .ticker {
      background: #006633;          /* deep green */
      color: #ffffff;
      height: 40px;
      overflow: hidden;
      white-space: nowrap;
      display: flex;
      align-items: center;
    }

    .ticker-track {
      display: inline-flex;
      align-items: center;
      /* two identical groups, so shifting by -50% loops seamlessly */
      animation: scroll 30s linear infinite;
    }

    .ticker-group {
      display: inline-flex;
      align-items: center;
    }

    .ticker-item {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .dot {
      width: 12px;
      height: 12px;
      margin: 0 90px;               /* spacing either side of the dot */
      border-radius: 50%;
      background: #e8d45a;          /* soft yellow */
      flex-shrink: 0;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker-track { animation: none; }
    }
  </style>
</head>
<body>

  <div class="ticker" role="marquee" aria-label="Vote casting underway in all regions">
    <div class="ticker-track">
      <div class="ticker-group">
        <span class="ticker-item">Vote casting underway in 10 regions</span>
        <span class="dot"></span>
        <span class="ticker-item">Vote casting underway in 10 regions</span>
        <span class="dot"></span>
        <span class="ticker-item">Vote casting underway in 10 regions</span>
        <span class="dot"></span>
      </div>
      <!-- duplicate group for seamless looping -->
      <div class="ticker-group" aria-hidden="true">
        <span class="ticker-item">Vote casting underway in 10 regions</span>
        <span class="dot"></span>
        <span class="ticker-item">Vote casting underway in 10 regions</span>
        <span class="dot"></span>
        <span class="ticker-item">Vote casting underway in 10 regions</span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

</body>
</html>
